services:
  #  loki:
  #    extends:
  #      file: ./config/docker/compose/observability.yml
  #      service: loki
  #  prometheus:
  #    extends:
  #      file: ./config/docker/compose/observability.yml
  #      service: prometheus
  #    depends_on:
  #      - loki
  #
  #  grafana:
  #    extends:
  #      file: ./config/docker/compose/observability.yml
  #      service: grafana
  #    depends_on:
  #      - loki
  #
  #  tempo:
  #    extends:
  #      file: ./config/docker/compose/observability.yml
  #      service: tempo
  #    depends_on:
  #      - loki

  db:
    extends:
      file: ./config/docker/compose/mariadb.yml
      service: mariadb
  #    depends_on:
  #      - loki
  #    logging: *default-logging

  web-app:
    image: shivain22/mifos-web-app:aurigraph
    restart: always
    environment:
      - FINERACT_API_URLS=https://finos-api.atparui.com
      - FINERACT_API_URL=https://finos-api.atparui.com
      - FINERACT_API_PROVIDER=/fineract-provider/api
      - FINERACT_API_VERSION=/v1
      - FINERACT_PLATFORM_TENANT_IDENTIFIER=default
      - MIFOS_DEFAULT_LANGUAGE=en-US
      - MIFOS_SUPPORTED_LANGUAGES=cs-CS,de-DE,en-US,es-MX,fr-FR,it-IT,ko-KO,lt-LT,lv-LV,ne-NE,pt-PT,sw-SW
      - MIFOS_PRELOAD_CLIENTS=true
      - MIFOS_DEFAULT_CHAR_DELIMITER=,
    ports:
      - 4200:80

  fineract:
    container_name: fineract-development
    extends:
      file: ./config/docker/compose/fineract.yml
      service: fineract
    ports:
      - "8443:8443"
      - "5000:5000"
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    #      loki:
    #        condition: service_started
    environment:
      - FINERACT_SERVER_SSL_ENABLED=false
      - FINERACT_SERVER_PORT=8080
    env_file:
      - ./config/docker/env/aws.env
      - ./config/docker/env/fineract.env
      - ./config/docker/env/fineract-common.env
      - ./config/docker/env/fineract-mariadb.env
      - ./config/docker/env/tracing.env
      - ./config/docker/env/oltp.env
      - ./config/docker/env/prometheus.env
      # - ./config/docker/env/cloudwatch.env
      - ./config/docker/env/debug.env
  #    logging: *default-logging

  postgres_primary:
    <<: *postgres-common
    ports:
      - "${POSTGRES_PRIMARY_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256\nhost replication all 0.0.0.0/0 md5"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: |
      postgres
      -c wal_level=replica
      -c hot_standby=on
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby_feedback=on

    volumes:
      #      - ./data/acm-db-data/postgres:/var/lib/postgresql/data
      - ./00_init.sql:/docker-entrypoint-initdb.d/00_init.sql

  postgres_replica:
    <<: *postgres-common
    ports:
      - "${POSTGRES_REPLICA_PORT}:5432"
    environment:
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      POSTGRES_HOST_AUTH_METHOD: "md5"
    #    volumes:
    #      - ./data/acm-db-data/postgres-replica:/var/lib/postgresql/data
    command: |
      bash -c "
      until pg_basebackup --pgdata=/var/lib/postgresql/data -R --slot=replication_slot --host=postgres_primary --port=5432
      do
        echo 'Waiting for primary to connect...'
        sleep 1s
      done
      echo 'Backup done, starting replica...'
      chmod 0700 /var/lib/postgresql/data
      postgres
      "
    depends_on:
      - postgres_primary



  # ACM Database (MySQL)
  mysqldbauri:
    image: mysql:8.0.30
    container_name: acm-db
    restart: always
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - ./data/acm-db-data/mysql:/var/lib/mysql

  # Ofbiz Application
  ofbiz:
    image: shivain22/ofbiz-docker:2-03-25-6
    container_name: ofbiz-app
    restart: always
    environment:
      #      DEFAULT_HOST: localhost
      #      VIRTUAL_HOST: localhost
      #      LETSENCRYPT_HOST: localhost
      #      LETSENCRYPT_EMAIL: admin@example.com
      OFBIZ_POSTGRES_OFBIZ_DB: ${OFBIZ_POSTGRES_OFBIZ_DB}
      OFBIZ_POSTGRES_OFBIZ_USER: ${OFBIZ_POSTGRES_OFBIZ_USER}
      OFBIZ_POSTGRES_OFBIZ_PASSWORD: ${OFBIZ_POSTGRES_OFBIZ_PASSWORD}
      OFBIZ_POSTGRES_OLAP_DB: ${OFBIZ_POSTGRES_OLAP_DB}
      OFBIZ_POSTGRES_OLAP_USER: ${OFBIZ_POSTGRES_OLAP_USER}
      OFBIZ_POSTGRES_OLAP_PASSWORD: ${OFBIZ_POSTGRES_OLAP_PASSWORD}
      OFBIZ_POSTGRES_TENANT_DB: ${OFBIZ_POSTGRES_TENANT_DB}
      OFBIZ_POSTGRES_TENANT_USER: ${OFBIZ_POSTGRES_TENANT_USER}
      OFBIZ_POSTGRES_TENANT_PASSWORD: ${OFBIZ_POSTGRES_TENANT_PASSWORD}
      OFBIZ_POSTGRES_HOST: ${OFBIZ_POSTGRES_HOST}
      OFBIZ_DATA_LOAD: ${OFBIZ_DATA_LOAD}

    ports:
      - "${OFBIZ_SSL_PORT}:8443"
      - "${OFBIZ_HTTP_PORT}:8089"
    depends_on:
      - postgres_primary


  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redisdata:/data


  # ACM Backend
  aurigraph-farmers-app:
    image: shivain22/aurigraph-farmers-app:v29
    container_name: acm-backend
    restart: always
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldbauri:3306/${MYSQL_DATABASE}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      SECURITY_JWT_SECRET_KEY: ${SECURITY_JWT_SECRET_KEY}
      SECURITY_JWT_EXPIRATION-TIME: ${SECURITY_JWT_EXPIRATION_TIME}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}
      SPRING_SERVLET_MULTIPART_ENABLED: ${SPRING_SERVLET_MULTIPART_ENABLED}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
      aurigraph.farmers.openapi.dev-url: ${AURIGRAPH_FARMERS_OPENAPI_DEV_URL}
      app.file.target.dir: ${APP_FILE_TARGET_DIR}
      resource.location: ${RESOURCE_LOCATION}
      twilio.account.sid: ${TWILIO_ACCOUNT_SID}
      twilio.auth.token: ${TWILIO_AUTH_TOKEN}
      twilio.phone.number: ${TWILIO_PHONE_NUMBER}
      digiLocker.client.id: ${DIGILOCKER_CLIENT_ID}
      digiLocker.client.secret: ${DIGILOCKER_CLIENT_SECRET}
      digiLocker.redirect.uri: ${DIGILOCKER_REDIRECT_URI}
      digiLocker.token.url: ${DIGILOCKER_TOKEN_URL}
      digiLocker.docs.url.issued: ${DIGILOCKER_DOCS_URL_ISSUED}
      digiLocker.docs.url.e-aadhaar: ${DIGILOCKER_DOCS_URL_E_AADHAAR}
      digiLocker.docs.by.uri: ${DIGILOCKER_DOCS_BY_URI}
      server.url: ${SERVER_URL}
      server.port: ${SERVER_PORT}
      digilocker.revoke: ${DIGILOCKER_REVOKE}


    volumes:
      - ./data/acm-content:/mnt/content
  # ACM Frontend
  frontend:
    image: shivain22/auri-farmer:v6.2
    container_name: acm-frontend
    restart: always
    ports:
      - "3005:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_OFBIZ_API_URL: ${NEXT_PUBLIC_OFBIZ_API_URL}



  # NGINX Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: always
    #    ports:
    #      - "80:80"
    #      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

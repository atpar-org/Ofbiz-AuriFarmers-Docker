version: '3.8'

x-postgres-common:
  &postgres-common
  image: postgres:14-alpine
  user: postgres
  restart: always
  healthcheck:
    test: 'pg_isready -U ofbiz --dbname=ofbiz'
    interval: 10s
    timeout: 5s
    retries: 5

